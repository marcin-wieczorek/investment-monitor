spring:
  application:
    name: investment-monitor
  datasource:
    # busy_timeout: the frontend (Node.js) may hold a write lock on this same
    # file concurrently; retry on a transient lock instead of failing fast.
    url: jdbc:sqlite:investment-monitor.db?busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  flyway:
    locations: classpath:db/migration

investment-monitor:
  validation:
    max-investment-drop-percentage: 50
  llm:
    # Disabled by default: a scan must never depend on a local LLM being
    # installed/running. Set to true once Ollama is set up (see docs/LLM.md).
    enabled: false
    base-url: http://localhost:11434
    model: qwen2.5:7b
    timeout-seconds: 60
  archival:
    enabled: true
    path: raw
    retention-days: 30
